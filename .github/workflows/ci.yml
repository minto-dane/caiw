name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'   # weekly — keeps the opam cache entry alive

jobs:
  test:
    name: build + regression (gcc, sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (documented flags)
        run: gcc -O3 -march=native -Wall -Wextra -pthread -o caiw caiw.c -lm

      - name: Build (-Werror)
        # keeps "zero warnings" a CI gate
        run: gcc -O3 -march=native -Wall -Wextra -Werror -pthread -o caiw_werr caiw.c -lm && rm caiw_werr

      - name: Build (portable baseline, no -march=native)
        # catches accidental ISA-specific assumptions
        run: gcc -O2 -Wall -Wextra -Werror -pthread -o caiw_base caiw.c -lm && rm caiw_base

      - name: Regression suite
        run: ./test.sh

      - name: Build (ASan+UBSan)
        run: gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread -o caiw_san caiw.c -lm

      - name: Sanitizer regression
        # exit-path allocations are a deliberate no-free-at-exit pattern —
        # leak reporting is off; OOB/UB still fail the run
        run: ASAN_OPTIONS=detect_leaks=0 ./test.sh ./caiw_san

  test-tsan:
    name: build + regression (TSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (ThreadSanitizer)
        run: gcc -O1 -g -fsanitize=thread -fno-omit-frame-pointer -pthread -o caiw_tsan caiw.c -lm

      - name: TSan regression
        # data races in the -j4 parallel encode/decode paths fail the run
        run: ./test.sh ./caiw_tsan

  verify:
    name: formal layers (TLA+/Alloy/CBMC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install CBMC
        # pinned official release deb — version-pinned for reproducibility
        run: |
          curl -fsSL -o /tmp/cbmc.deb \
            https://github.com/diffblue/cbmc/releases/download/cbmc-6.11.0/ubuntu-24.04-cbmc-6.11.0-Linux.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/cbmc.deb
          cbmc --version

      - name: Download TLA+ / Alloy jars
        run: |
          mkdir -p verify/tools
          curl -fsSL -o verify/tools/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          curl -fsSL -o verify/tools/org.alloytools.alloy.dist.jar \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar

      - name: Run verify.sh
        # Frama-C runs in verify-framac below; it reports SKIP here.
        run: ./verify/verify.sh

  test-arm:
    name: build + regression (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build (documented flags)
        run: gcc -O3 -march=native -Wall -Wextra -pthread -o caiw caiw.c -lm

      - name: Regression suite
        run: ./test.sh

  verify-framac:
    name: formal layers (Frama-C EVA+WP)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache opam switch
        # first uncached run builds OCaml+Frama-C from source (~40min);
        # the weekly cron in `on:` keeps the cache entry alive
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: ${{ runner.os }}-opam-caiw-fc-framac33-v2

      - name: Install opam
        run: |
          sudo apt-get update
          sudo apt-get install -y opam unzip graphviz

      - name: Build Frama-C switch (first run only)
        # versions pinned to the locally proven set: frama-c 33.0,
        # why3 1.8.2, alt-ergo-free 2.4.3
        run: |
          if [ ! -x ~/.opam/caiw-fc/bin/frama-c ]; then
            opam init -y --bare --disable-sandboxing
            opam switch create caiw-fc ocaml-base-compiler.5.3.0 -y
            eval $(opam env --switch=caiw-fc)
            opam install -y --assume-depexts frama-c.33.0 why3.1.8.2 alt-ergo-free.2.4.3
          fi

      - name: Pin z3 4.13.3 (matches local prover)
        run: |
          mkdir -p verify/tools/bin
          curl -fsSL -o /tmp/z3.zip \
            https://github.com/Z3Prover/z3/releases/download/z3-4.13.3/z3-4.13.3-x64-glibc-2.35.zip
          unzip -o /tmp/z3.zip -d /tmp/z3x
          cp /tmp/z3x/z3-4.13.3-x64-glibc-2.35/bin/z3 verify/tools/bin/z3
          chmod +x verify/tools/bin/z3

      - name: Register why3 provers
        run: |
          eval $(opam env --switch=caiw-fc)
          export PATH="$PWD/verify/tools/bin:$PATH"
          why3 config detect

      - name: Run verify.sh
        # verify.sh finds frama-c via PATH (opam env) and z3 via
        # verify/tools/bin on the WP step's PATH prefix.
        run: |
          eval $(opam env --switch=caiw-fc)
          ./verify/verify.sh
